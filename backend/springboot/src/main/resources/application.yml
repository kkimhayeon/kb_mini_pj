spring:
  application:
    name: springboot
  config:
    # 루트 .env 를 읽는다 (backend/springboot 또는 저장소 루트에서 실행하는 경우 모두)
    import:
      - optional:file:.env[.properties]
      - optional:file:../../.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:gap_agent}
    username: ${DB_USERNAME:gap}
    password: ${DB_PASSWORD:gap}
  jpa:
    hibernate:
      # 스키마는 db/schema.sql 로 관리한다. Hibernate 는 검증만 한다
      ddl-auto: validate
    open-in-view: false

dart:
  api:
    key: ${DART_API_KEY}
    base-url: https://opendart.fss.or.kr/api

gemini:
  api:
    key: ${GEMINI_API_KEY:}
    base-url: https://generativelanguage.googleapis.com
    model: gemini-2.5-flash
